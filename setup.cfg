[extract_messages]
mapping_file = babel.cfg
output_file = translations/messages.pot
input_dirs = .
charset = utf-8

[init_catalog]
domain = messages
input_file = translations/messages.pot
output_dir = translations

[update_catalog]
domain = messages
input_file = translations/messages.pot
output_dir = translations

[compile_catalog]
domain = messages
directory = translations
statistics = true
