<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ _('Verification Link Expired Title') }} - {{ _('Help Desk') }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b, #2563eb);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      padding: 30px;
      text-align: center;
    }
    .logo { font-size: 50px; margin-bottom: 10px; color: #fff; }
    .title { text-align: center; color: #fff; font-weight: bold; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #d1d5db; margin-bottom: 20px; }
    .btn-primary { height: 45px; font-weight: bold; border-radius: 10px; }
    .btn-outline { height: 45px; font-weight: bold; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><i class="fa-solid fa-clock" style="color:#fbbf24;"></i></div>
    <h2 class="title">{{ _('Verification Link Expired Title') }}</h2>
    <p class="subtitle">{{ _('Verification Link Expired Message') }}</p>
    <p class="subtitle">{{ _('Verification Can Request New') }}</p>
    {% if request.args.get('resent') == 'success' %}
    <div class="alert alert-success alert-dismissible fade show" role="alert" style="background:rgba(34,197,94,0.2); border:1px solid rgba(34,197,94,0.5); color:#4ade80; border-radius:8px;">
      {{ _('Verification Email Sent To Inbox') }}
    </div>
    {% endif %}
    <form method="post" id="resendForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" style="color:#fff;">{{ _('Registered Email') }}</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="{{ _('Enter Registered Email') }}" required style="height:50px; border-radius:10px;">
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-outline">{{ _('Resend Verification Email') }}</button>
      </div>
    </form>
    <div class="text-center mt-3">
      <a href="/login" class="text-primary fw-bold text-decoration-none">{{ _('Back To Login') }}</a>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script>
    document.getElementById("resendForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) { return; }
      fetch("/auth/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": document.querySelector('meta[name="csrf-token"]').getAttribute('content') },
        body: JSON.stringify({ email: email })
      })
      .then(response => response.json().then(data => ({ status: response.status, ok: response.ok, data })))
      .then(result => {
        alert(result.data.message || (result.ok ? i18n.t('verification_email_sent') : i18n.t('error')));
        if (result.ok) { window.location.href = "/resend-verification?resent=success"; }
      })
      .catch(() => { i18n.alertT('error_occurred'); });
    });
  </script>
</body>
</html>
