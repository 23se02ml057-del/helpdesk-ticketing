{% extends "layout_customer.html" %}

{% block title %}
{{ _('Change Password') }}
{% endblock %}

{% block page_title %}
{{ _('Change Password') }}
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-4 col-12 col-md-6">
            <div class="card shadow border-0 rounded-4 mt-4">
                <div class="card-header bg-white">
                    <h5 class="fw-bold mb-0">
                        <i class="fa-solid fa-key text-warning me-2"></i> {{ _('Change Password') }}
                    </h5>
                </div>
                <div class="card-body">
                    <form id="changePasswordForm" method="POST" action="{{ url_for(\'auth.change_password\') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">{{ _('Current Password') }}</label>
                            <input type="password" id="currentPassword" name="current_password" class="form-control"
                                placeholder="{{ _('Current Password') }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{ _('New Password') }}</label>
                            <input type="password" id="newPassword" name="new_password" class="form-control"
                                placeholder="{{ _('New Password') }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{ _('Confirm Password') }}</label>
                            <input type="password" id="confirmPassword" name="confirm_password" class="form-control"
                                placeholder="{{ _('Confirm Password') }}" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">
                            <i class="fa-solid fa-floppy-disk me-1"></i> {{ _('Update Password') }}
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ dashboard_url }}" class="text-decoration-none">
                            <i class="fa-solid fa-arrow-left me-1"></i> {{ _('Back To Dashboard') }}
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script>
    function checkPasswordRequirements() {
        const password = document.getElementById('newPassword').value;
        const hasLength = password.length >= 8;
        const hasUpper = /[A-Z]/.test(password);
        const hasLower = /[a-z]/.test(password);
        const hasNumber = /[0-9]/.test(password);
        return hasLength && hasUpper && hasLower && hasNumber;
    }

    document.getElementById('changePasswordForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;

        if (!checkPasswordRequirements()) {
            i18n.alertT('password_requirements');
            return;
        }
        if (newPassword !== confirmPassword) {
            i18n.alertT('passwords_do_not_match');
            return;
        }
        if (currentPassword === newPassword) {
            i18n.alertT('password_must_be_different_msg');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>' + i18n.t('changing');

        try {
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            const response = await fetch('/auth/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({
                    current_password: currentPassword,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });
            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                setTimeout(() => { window.location.href = '/login'; }, 1500);
            } else {
                alert(data.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        } catch (error) {
            i18n.alertT('error_occurred');
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    });
</script>
{% endblock %}
