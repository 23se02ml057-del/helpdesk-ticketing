<!DOCTYPE html>
<html lang="{{ get_locale() }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ _('Forgot Password') }} - {{ _('Help Desk') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: 'Poppins', 'Noto Sans', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #2563eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
            margin: 15px;
        }

        .logo {
            font-size: 60px;
            text-align: center;
            margin-bottom: 10px;
            color: #fff;
        }

        .title {
            text-align: center;
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #d1d5db;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-label {
            color: #fff;
            font-weight: 500;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
            font-size: 15px;
        }

        .btn-submit {
            height: 50px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 20px;
            width: 100%;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            transition: 0.3s;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #d1d5db;
            font-size: 14.5px;
        }

        .login-link a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media(max-width:576px) {
            .register-card {
                padding: 30px 20px;
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="register-card" style="position:relative;">
        <!-- Language Switcher snippet -->
        <div style="position:absolute; top:15px; right:15px;">
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-light dropdown-toggle d-flex align-items-center gap-1"
                    type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                    style="font-size:0.75rem; padding:2px 8px; border-radius:6px; opacity:0.9;">
                    <i class="fa-solid fa-globe"></i>
                    <span id="currentLanguageLabel">
                        {% if session.get('locale', 'en') == 'en' %}{{ _('Language En') }}
                        {% elif session.get('locale', 'en') == 'zh' %}{{ _('Language Zh') }}
                        {% elif session.get('locale', 'en') == 'de' %}{{ _('Language De') }}
                        {% elif session.get('locale', 'en') == 'fr' %}{{ _('Language Fr') }}
                        {% elif session.get('locale', 'en') == 'tr' %}{{ _('Language Tr') }}
                        {% elif session.get('locale', 'en') == 'gu' %}{{ _('Language Gu') }}
                        {% else %}{{ _('Language En') }}{% endif %}
                    </span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="languageDropdown"
                    style="min-width:150px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:#1e293b;">
                    <li class="dropdown-header" style="font-size:0.75rem; color:#d1d5db;">{{ _('Language Name') }}</li>
                    <li><a class="dropdown-item d-flex align-items-center gap-2 {% if session.get('locale', 'en') == 'en' %}active{% endif %}"
                            href="{{ url_for('set_language', locale='en') }}"
                            style="font-size:0.8rem; color:#fff;"><span>🇬🇧</span> {{ _('Language En') }}</a></li>
                    <li><a class="dropdown-item d-flex align-items-center gap-2 {% if session.get('locale', 'en') == 'zh' %}active{% endif %}"
                            href="{{ url_for('set_language', locale='zh') }}"
                            style="font-size:0.8rem; color:#fff;"><span>🇨🇳</span> {{ _('Language Zh') }}</a></li>
                    <li><a class="dropdown-item d-flex align-items-center gap-2 {% if session.get('locale', 'en') == 'de' %}active{% endif %}"
                            href="{{ url_for('set_language', locale='de') }}"
                            style="font-size:0.8rem; color:#fff;"><span>🇩🇪</span> {{ _('Language De') }}</a></li>
                    <li><a class="dropdown-item d-flex align-items-center gap-2 {% if session.get('locale', 'en') == 'fr' %}active{% endif %}"
                            href="{{ url_for('set_language', locale='fr') }}"
                            style="font-size:0.8rem; color:#fff;"><span>🇫🇷</span> {{ _('Language Fr') }}</a></li>
                    <li><a class="dropdown-item d-flex align-items-center gap-2 {% if session.get('locale', 'en') == 'tr' %}active{% endif %}"
                            href="{{ url_for('set_language', locale='tr') }}"
                            style="font-size:0.8rem; color:#fff;"><span>🇹🇷</span> {{ _('Language Tr') }}</a></li>
                </ul>
            </div>
        </div>

        <div class="logo">
            <img src="{{ url_for('static', filename='favicon.svg') }}" alt="Help Desk Logo"
                style="width:50px; height:50px; border-radius:12px;">
        </div>
        <h2 class="title">{{ _('Forgot Password') }}</h2>
        <p class="subtitle">{{ _('Recover Account Access') }}</p>

        <div id="message"></div>
        <div id="resetLinkBox" style="display:none;" class="alert alert-success"></div>

        <form id="forgotForm">
            <div class="mb-3">
                <input type="email" class="form-control bg-light" id="email"
                    placeholder="{{ _('Enter Registered Email') }}" required>
            </div>
            <button type="submit" class="btn btn-primary btn-submit">
                {{ _('Send Reset Link') }}
            </button>
        </form>

        <div class="login-link">
            <i class="fa-solid fa-arrow-left me-1"></i> <a href="/login">{{ _('Back To Login') }}</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        document.getElementById("forgotForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const messageDiv = document.getElementById("message");
            const resetLinkBox = document.getElementById("resetLinkBox");
            const submitBtn = document.querySelector(".btn-submit");

            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Sending...';

            messageDiv.innerHTML = '';
            resetLinkBox.style.display = 'none';

            if (!email || !email.includes('@')) {
                messageDiv.innerHTML = '<div style="color:#f8d7da; text-align:center; margin-bottom:15px; padding:15px; background:rgba(248,118,117,0.1); border-radius:8px;">Please enter a valid email address.</div>';
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
                return;
            }

            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
                const response = await fetch("/auth/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken,
                    },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();

                if (response.ok) {
                    // Success message as requested by user
                    messageDiv.innerHTML = '<div style="color:#d4edda; text-align:center; margin-bottom:15px; padding:15px; background:rgba(34,197,94,0.1); border-radius:8px;">Successfully sent reset password link. Please check your email.</div>';
                    document.getElementById("forgotForm").style.display = 'none'; // Hide form after success
                } else {
                    messageDiv.innerHTML = '<div style="color:#f8d7da; text-align:center; margin-bottom:15px; padding:15px; background:rgba(248,118,117,0.1); border-radius:8px;">' + data.message + '</div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div style="color:#f8d7da; text-align:center; margin-bottom:15px; padding:15px; background:rgba(248,118,117,0.1); border-radius:8px;">A network error occurred. Please try again.</div>';
            }

            submitBtn.innerHTML = originalBtnHtml;
            submitBtn.disabled = false;
        });
    </script>
</body>

</html>
