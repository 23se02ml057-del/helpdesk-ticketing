{% extends "layout_admin.html" %}

{% block title %}
{{ _('Add Skill') }}
{% endblock %}

{% block page_title %}
{{ _('Add Skill') }}
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4 align-items-center">
        <div class="col-12 col-md-6 mb-3 mb-md-0">
            <h2 class="fw-bold">
                <i class="fa-solid fa-brain"></i>
                {{ _('Add Skill') }}
            </h2>
            <p class="text-muted mb-0">{{ _('Create') }} a new skill</p>
        </div>
        <div class="col-12 col-md-6 text-md-end">
            <a href="{{ url_for('admin.admin_skills') }}" class="btn btn-secondary">
                <i class="fa fa-arrow-left me-1"></i> {{ _('Back') }} to {{ _('Skills') }}
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form action="{{ url_for('admin.admin_save_skill') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">{{ _('Department') }} <span class="text-danger">*</span></label>
                    <select class="form-select" id="addDepartment" name="department_id" required>
                        <option value="">-- {{ _('Select Department') }} --</option>
                        {% for dept in departments %}
                        <option value="{{ dept.department_id }}">{{ dept.department_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('Category') }} <span class="text-danger">*</span></label>
                    <select class="form-select" id="addCategory" name="category_name" required>
                        <option value="">-- {{ _('Select Category') }} --</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('Skill Name') }} <span class="text-danger">*</span></label>
                    <input type="text" name="skill_name" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">{{ _('Status') }}</label>
                    <select name="status" class="form-select">
                        <option value="{{ _('Active') }}">{{ _('Active') }}</option>
                        <option value="{{ _('Inactive') }}">{{ _('Inactive') }}</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fa fa-save me-1"></i> {{ _('Save Skill') }}
                    </button>
                    <a href="{{ url_for('admin.admin_skills') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var addDepartment = document.getElementById('addDepartment');
    var addCategory = document.getElementById('addCategory');

    function loadCategories(selectEl, departmentId) {
        selectEl.innerHTML = '<option value="">-- Select Category --</option>';
        if (!departmentId) return;
        fetch('/api/categories?department_id=' + departmentId)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                data.forEach(function(cat) {
                    var opt = document.createElement('option');
                    opt.value = cat.category_name;
                    opt.textContent = cat.category_name;
                    selectEl.appendChild(opt);
                });
            });
    }

    if (addDepartment) {
        addDepartment.addEventListener('change', function() {
            loadCategories(addCategory, this.value);
        });
    }
});
</script>
{% endblock %}
