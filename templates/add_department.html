<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <title>{{ _('Add Department') }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <h2>{{ _('Add Department') }}</h2>

        <form action="/save-department" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="mb-3">

                <label class="form-label">{{ _('Department Name') }}</label>

                <input type="text" name="department_name" class="form-control" required>

            </div>

            <div class="mb-3">

                <label class="form-label">{{ _('Status') }}</label>

                <select name="status" class="form-select">

                    <option value="Active">Active</option>

                    <option value="Inactive">Inactive</option>

                </select>

            </div>

            <button class="btn btn-success">

                {{ _('Save Department') }}

            </button>

            <a href="/departments" class="btn btn-secondary">

                {{ _('Back') }}

            </a>

        </form>

    </div>

</body>

</html>
