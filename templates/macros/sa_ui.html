{# Super Admin reusable UI fragments #}

{% macro sa_page_header(title, subtitle=None) %}
<div class="sa-page-header">
    <div class="sa-page-header__text">
        <h1 class="sa-page-title">{{ title }}</h1>
        {% if subtitle %}
        <p class="sa-page-subtitle">{{ subtitle }}</p>
        {% endif %}
    </div>
    {% if caller %}
    <div class="sa-page-header__actions">
        {{ caller() }}
    </div>
    {% endif %}
</div>
{% endmacro %}
