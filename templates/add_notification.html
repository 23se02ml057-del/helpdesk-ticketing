<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('Add') }} Notification Popup</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      background: #f4f6f9;
    }

    .modal-header {
      background: #0d6efd;
      color: white;
    }

    label {
      font-weight: 600;
    }

    .form-control,
    .form-select {
      border-radius: 10px;
    }

    .btn {
      border-radius: 10px;
      padding: 10px 22px;
    }

    textarea {
      resize: none;
    }
  </style>
</head>

<body>

<div class="container mt-5 text-center">
  <!-- Trigger Button -->
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addNotificationModal">
    <i class="fa-solid fa-bell"></i> {{ _('Add') }} Notification
  </button>
</div>

<!-- Modal -->
<div class="modal fade" id="addNotificationModal" tabindex="-1" aria-labelledby="addNotificationLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title" id="addNotificationLabel">
          <i class="fa-solid fa-bell"></i> Add Notification
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form action="{{ url_for('notifications.save_notification') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <!-- User -->
          <div class="mb-3">
            <label class="form-label">Select User</label>
            <select name="user_id" class="form-select" required>
              <option value="">Choose User</option>
              {% for user in users %}
              <option value="{{ user.user_id }}">{{ user.first_name }} {{ user.last_name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Notification {{ _('Title') }}</label>
            <input type="text" name="title" class="form-control" placeholder="Enter Notification Title" required>
          </div>

          <!-- Message -->
          <div class="mb-3">
            <label class="form-label">Notification {{ _('Message') }}</label>
            <textarea name="message" class="form-control" rows="4" placeholder="Enter Notification Message" required></textarea>
          </div>

          <!-- Read Status -->
          <div class="mb-3">
            <label class="form-label">Read {{ _('Status') }}</label>
            <select name="is_read" class="form-select">
              <option value="False" selected>{{ _('Unread') }}</option>
              <option value="True">{{ _('Read') }}</option>
            </select>
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('notifications.notifications') }}" class="btn btn-secondary">
              <i class="fa-solid fa-arrow-left"></i> {{ _('Back') }}
            </a>
            <button type="submit" class="btn btn-success">
              <i class="fa-solid fa-floppy-disk"></i> Save Notification
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
