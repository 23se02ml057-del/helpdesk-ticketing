<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Add') }} SLA Rule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background: #f4f6f9; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,.12); }
        .card-header { background: #0d6efd; color: white; font-size: 20px; font-weight: bold; padding: 18px; border-radius: 15px 15px 0 0 !important; }
        label { font-weight: 600; margin-bottom: 6px; }
        .form-control, .form-select { border-radius: 10px; }
        .btn { border-radius: 10px; padding: 10px 22px; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-clock me-2"></i> Add SLA Rule
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('save_sla_rule') }}">
                        <div class="mb-3">
                            <label class="form-label">{{ _('Priority') }}</label>
                            <select name="priority_name" class="form-select" required>
                                <option value="">Select Priority</option>
                                {% for priority in priorities %}
                                <option value="{{ priority.priority_name }}">{{ priority.priority_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Response Time (hours)</label>
                                <input type="number" name="response_time" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Resolution Time (hours)</label>
                                <input type="number" name="resolution_time" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{ _('Status') }}</label>
                            <select name="status" class="form-select" required>
                                <option value="Active" selected>Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('sla_rules') }}" class="btn btn-secondary">
                                <i class="fa-solid fa-arrow-left"></i> {{ _('Back') }}
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-plus me-1"></i> Add SLA Rule
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
