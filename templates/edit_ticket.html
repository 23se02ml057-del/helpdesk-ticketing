<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit {{ _('Ticket') }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning text-dark">

<h3>Edit {{ _('Ticket') }}</h3>

</div>

<div class="card-body">

<form action="/update-ticket/{{ ticket.ticket_id }}"
      method="POST">

<div class="mb-3">

<label class="form-label">

{{ _('Ticket') }} Title

</label>

<input
type="text"
name="title"
class="form-control"
value="{{ ticket.title }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

{{ _('Description') }}

</label>

<textarea
name="description"
class="form-control"
rows="4"
required>{{ ticket.description }}</textarea>

</div>

<div class="mb-3">

<label class="form-label">

{{ _('Category') }}

</label>

<select
name="category_name"
class="form-select">

{% for category in categories %}

<option
value="{{ category.category_name}}"
{% if category.category_name== ticket.category_name%}
selected
{% endif %}>

{{ category.category_name}}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

{{ _('Priority') }}

</label>

<select
name="priority_name"
class="form-select">

{% for priority in priorities %}

<option
value="{{ priority.priority_name }}"
{% if priority.priority_name == ticket.priority_name %}
selected
{% endif %}>

{{ priority.priority_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

{{ _('Status') }}

</label>

<select
name="status_name"
class="form-select">

{% for status in statuses %}

<option
value="{{ status.status_name }}"
{% if status.status_name == ticket.status_name %}
selected
{% endif %}>

{{ status.status_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Requester

</label>

<select
name="requester_id"
class="form-select">

{% for user in users %}

<option
value="{{ user.user_id }}"
{% if user.user_id == ticket.requester_id %}
selected
{% endif %}>

{{ user.first_name }} {{ user.last_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Assigned Agent

</label>

<select
name="assigned_to"
class="form-select">

{% for user in users %}

<option
value="{{ user.user_id }}"
{% if user.user_id == ticket.assigned_to %}
selected
{% endif %}>

{{ user.first_name }} {{ user.last_name }}

</option>

{% endfor %}

</select>

</div>

<button
type="submit"
class="btn btn-success">

Update {{ _('Ticket') }}

</button>

<a
href="/tickets"
class="btn btn-secondary">

{{ _('Cancel') }}

</a>

</form>

</div>

</div>

</div>

</body>

</html>
