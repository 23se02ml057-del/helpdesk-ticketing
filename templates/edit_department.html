<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ _('Edit') }} Department</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4>{{ _('Edit') }} Department</h4>

                </div>

                <div class="card-body">

                    <form
                        action="/update-department/{{ department.department_id }}"
                        method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                        <div class="mb-3">

                            <label class="form-label">

                                Department ID

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ department.department_id }}"
                                readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Department Name

                            </label>

                            <input
                                type="text"
                                name="department_name"
                                class="form-control"
                                value="{{ department.department_name }}"
                                required>

                        </div>

<div class="mb-3">
    <label class="form-label">{{ _('Status') }}</label>

    <select name="status" class="form-select">

        <option value="Active"
            {% if department.status == 'Active' %}selected{% endif %}>
            Active
        </option>

        <option value="Inactive"
            {% if department.status == 'Inactive' %}selected{% endif %}>
            Inactive
        </option>

    </select>
</div>

                        <button
                            type="submit"
                            class="btn btn-success">

                            Update Department

                        </button>

                        <a
                            href="/departments"
                            class="btn btn-secondary">

                            {{ _('Cancel') }}

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
