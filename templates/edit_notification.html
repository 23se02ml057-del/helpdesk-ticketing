<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ _('Edit') }} Notification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.12);
        }

        .card-header{
            background:#ffc107;
            color:#000;
            font-size:25px;
            font-weight:bold;
            padding:18px;
            border-radius:15px 15px 0 0 !important;
        }

        label{
            font-weight:600;
            margin-bottom:6px;
        }

        .form-control,
        .form-select{
            border-radius:10px;
        }

        textarea{
            resize:none;
        }

        .btn{
            border-radius:10px;
            padding:10px 22px;
        }

        .notification-icon{
            font-size:65px;
            color:#ffc107;
            text-align:center;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-12 col-lg-8">

<div class="card">

<div class="card-header">

<i class="fa-solid fa-pen-to-square"></i>

{{ _('Edit') }} Notification

</div>

<div class="card-body">

<div class="notification-icon">

<i class="fa-solid fa-bell"></i>

</div>

<form action="{{ url_for('notifications.update_notification', notification_id=notification.notification_id) }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="mb-3">

<label>

Select User

</label>

<select
name="user_id"
class="form-select"
required>

{% for user in users %}

<option
value="{{ user.user_id }}"
{% if user.user_id == notification.user_id %}
selected
{% endif %}>

{{ user.first_name }}
{{ user.last_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>

Notification {{ _('Title') }}

</label>

<input
type="text"
name="title"
class="form-control"
value="{{ notification.title }}"
required>

</div>

<div class="mb-3">

<label>

Notification {{ _('Message') }}

</label>

<textarea
name="message"
rows="5"
class="form-control"
required>{{ notification.message }}</textarea>

</div>

<div class="mb-4">

<label>

Notification {{ _('Status') }}

</label>

<select
name="is_read"
class="form-select">

<option value="False"
{% if notification.is_read==False %}
selected
{% endif %}>

Unread

</option>

<option value="True"
{% if notification.is_read==True %}
selected
{% endif %}>

Read

</option>

</select>

</div>

<hr>

<div class="d-flex justify-content-between">

<a
href="{{ url_for('notifications.notifications') }}"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

{{ _('Back') }}

</a>

<button
type="submit"
class="btn btn-warning">

<i class="fa-solid fa-floppy-disk"></i>

{{ _('Update') }} Notification

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
