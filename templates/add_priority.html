<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Add') }} Priority</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background: #f4f6f9; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,.12); }
        .card-header { background: #0d6efd; color: white; font-size: 20px; font-weight: bold; padding: 18px; border-radius: 15px 15px 0 0 !important; }
        label { font-weight: 600; margin-bottom: 6px; }
        .form-control, .form-select { border-radius: 10px; }
        .btn { border-radius: 10px; padding: 10px 22px; }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-6">
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-plus-circle me-2"></i> Add {{ _('Priority') }}
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('add_priority') }}">
                        <div class="mb-3">
                            <label class="form-label">Priority {{ _('Name') }}</label>
                            <input type="text" name="priority_name" class="form-control" placeholder="Enter priority name" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('priorities_page') }}" class="btn btn-secondary">
                                <i class="fa-solid fa-arrow-left"></i> {{ _('Back') }}
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-plus me-1"></i> Add Priority
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
