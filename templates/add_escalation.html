<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ _('Add') }} Escalation Rule</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        .card-header{
            background:#0d6efd;
            color:white;
            font-size:22px;
            font-weight:bold;
        }

        .btn{
            border-radius:8px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-12 col-lg-8">

<div class="card">

<div class="card-header">

{{ _('Add') }} Escalation Rule

</div>

<div class="card-body">
    

<form action="/save-escalation" method="POST">

<!-- Priority -->

<div class="mb-3">

<label class="form-label">

{{ _('Priority') }}

</label>

<select
name="priority_name"
class="form-select"
required>

<option value="">

Select Priority

</option>

{% for priority in priorities %}

<option value="{{ priority.priority_name }}">

{{ priority.priority_name }}

</option>

{% endfor %}

</select>

</div>

<!-- SLA Rule -->

<div class="mb-3">

<label class="form-label">

SLA Rule

</label>

<select
name="sla_id"
class="form-select"
required>

<option value="">

Select SLA Rule

</option>

{% for sla in sla_rules %}

<option value="{{ sla.sla_id }}">

SLA #{{ sla.sla_id }}
-
{{ sla.response_time }} Min
/
{{ sla.resolution_time }} Min

</option>

{% endfor %}

</select>

</div>

<!-- Escalation After -->

<div class="mb-3">

<label class="form-label">

Escalation After (Minutes)

</label>

<input
type="number"
name="escalation_after"
class="form-control"
placeholder="Example : 30"
required>

</div>

<!-- Notify Role -->

<div class="mb-3">

<label class="form-label">

Notify {{ _('Role') }}

</label>

<select
name="notify_role"
class="form-select"
required>

<option value="">

Select {{ _('Role') }}

</option>

<option value="Support Agent">

Support Agent

</option>

<option value="Support Manager">

Support Manager

</option>

<option value="Super Admin">

Super Admin

</option>

</select>

</div>

<!-- Status -->

<div class="mb-4">

<label class="form-label">

{{ _('Status') }}

</label>

<select
name="status"
class="form-select">

<option value="Active">

Active

</option>

<option value="Inactive">

Inactive

</option>

</select>

</div>

<div class="d-flex justify-content-between">

<a
href="/escalations"
class="btn btn-secondary">

{{ _('Back') }}

</a>

<button
type="submit"
class="btn btn-success">

{{ _('Save') }} Escalation Rule

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
