{% extends "layout.html" %}

{% block title %}
{{ _('Page Not Found') }} - {{ _('Help Desk') }}
{% endblock %}

{% block content %}
<div class="container-fluid text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-5">
                    <i class="fa-solid fa-triangle-exclamation fa-4x text-warning mb-4"></i>
                    <h1 class="display-1 fw-bold text-primary">404</h1>
                    <h3 class="mb-3">{{ _('Page Not Found') }}</h3>
                    <p class="text-muted mb-4">{{ _('Page Not Found Message') }}</p>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                        <i class="fa-solid fa-home me-2"></i>{{ _('Go To Dashboard') }}
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
