<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ _('Change Password Title') }}</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins','Noto Sans','Segoe UI',sans-serif;
        }
        body{
            background:#f4f6f9;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }
        .change-password-card{
            width:100%;
            max-width:500px;
            background:white;
            border-radius:16px;
            box-shadow:0 10px 40px rgba(0,0,0,0.1);
            overflow:hidden;
        }
        .card-header{
            background:linear-gradient(135deg, #2563eb, #1d4ed8);
            color:white;
            padding:30px;
            text-align:center;
        }
        .card-header i{
            font-size:48px;
            margin-bottom:15px;
        }
        .card-header h2{
            margin:0;
            font-weight:600;
        }
        .card-body{
            padding:30px;
        }
        .form-group{
            margin-bottom:20px;
        }
        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:500;
            color:#374151;
        }
        .input-group{
            position:relative;
        }
        .input-group input{
            width:100%;
            padding:12px 45px 12px 15px;
            border:2px solid #e5e7eb;
            border-radius:10px;
            font-size:15px;
            transition:all 0.3s;
        }
        .input-group input:focus{
            outline:none;
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,0.1);
        }
        .toggle-password{
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            color:#9ca3af;
            cursor:pointer;
            padding:5px;
        }
        .toggle-password:hover{
            color:#2563eb;
        }
        .password-requirements{
            background:#f9fafb;
            border-radius:8px;
            padding:15px;
            margin-top:10px;
        }
        .password-requirements h6{
            color:#6b7280;
            font-size:13px;
            margin-bottom:10px;
        }
        .requirement{
            display:flex;
            align-items:center;
            gap:8px;
            font-size:13px;
            color:#6b7280;
            margin-bottom:5px;
        }
        .requirement i{
            font-size:12px;
        }
        .requirement.met{
            color:#10b981;
        }
        .requirement.not-met{
            color:#ef4444;
        }
        .btn-submit{
            width:100%;
            padding:14px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.3s;
        }
        .btn-submit:hover{
            background:#1d4ed8;
            transform:translateY(-1px);
        }
        .btn-submit:disabled{
            background:#9ca3af;
            cursor:not-allowed;
            transform:none;
        }
        .alert{
            padding:12px 16px;
            border-radius:10px;
            margin-bottom:20px;
            display:none;
        }
        .alert-success{
            background:#d4edda;
            color:#155724;
            border:1px solid #c3e6cb;
        }
        .alert-danger{
            background:#f8d7da;
            color:#721c24;
            border:1px solid #f5c6cb;
        }
        .back-link{
            text-align:center;
            margin-top:20px;
        }
        .back-link a{
            color:#2563eb;
            text-decoration:none;
            font-weight:500;
        }
        .back-link a:hover{
            text-decoration:underline;
        }
        @media(max-width:576px){
            .card-header{
                padding:20px;
            }
            .card-body{
                padding:20px;
            }
            .card-header i{
                font-size:36px;
            }
        }
    </style>
</head>
<body>
    <div class="change-password-card">
        <div class="card-header">
            <i class="fa-solid fa-lock"></i>
            <h2>{{ _('Change Password Title') }}</h2>
        </div>
        <div class="card-body">
            <div id="alertBox" class="alert"></div>

            <form id="changePasswordForm">
                <div class="form-group">
                    <label for="currentPassword">{{ _('Current Password') }}</label>
                    <div class="input-group">
                        <input type="password" id="currentPassword" placeholder="{{ _('Current Password') }}" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('currentPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword">{{ _('New Password') }}</label>
                    <div class="input-group">
                        <input type="password" id="newPassword" placeholder="{{ _('New Password') }}" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('newPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-requirements">
                        <h6>{{ _('Password Must Contain') }}</h6>
                        <div class="requirement" id="req-length">
                            <i class="fa-solid fa-circle"></i>
                            <span>{{ _('Req At Least 8') }}</span>
                        </div>
                        <div class="requirement" id="req-upper">
                            <i class="fa-solid fa-circle"></i>
                            <span>{{ _('Req One Uppercase Az') }}</span>
                        </div>
                        <div class="requirement" id="req-lower">
                            <i class="fa-solid fa-circle"></i>
                            <span>{{ _('Req One Lowercase Az') }}</span>
                        </div>
                        <div class="requirement" id="req-number">
                            <i class="fa-solid fa-circle"></i>
                            <span>{{ _('Req One Number 09') }}</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">{{ _('Confirm Password') }}</label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" placeholder="{{ _('Confirm Password') }}" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small id="matchMessage" style="color:#ef4444;display:none;margin-top:5px;">
                        {{ _('Passwords Do Not Match') }}
                    </small>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fa-solid fa-key me-2"></i>{{ _('Change Password Title') }}
                </button>
            </form>

            <div class="back-link">
                <a href="/">
                    <i class="fa-solid fa-arrow-left me-1"></i> {{ _('Back To Dashboard') }}
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        function togglePasswordVisibility(fieldId, button) {
            const input = document.getElementById(fieldId);
            const icon = button.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function checkPasswordRequirements() {
            const password = document.getElementById('newPassword').value;
            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);

            updateRequirement('req-length', hasLength);
            updateRequirement('req-upper', hasUpper);
            updateRequirement('req-lower', hasLower);
            updateRequirement('req-number', hasNumber);

            return hasLength && hasUpper && hasLower && hasNumber;
        }

        function updateRequirement(id, met) {
            const element = document.getElementById(id);
            const icon = element.querySelector('i');

            if (met) {
                element.classList.remove('not-met');
                element.classList.add('met');
                icon.classList.remove('fa-circle');
                icon.classList.add('fa-check-circle');
            } else {
                element.classList.remove('met');
                element.classList.add('not-met');
                icon.classList.remove('fa-check-circle');
                icon.classList.add('fa-circle');
            }
        }

        function checkPasswordMatch() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const matchMessage = document.getElementById('matchMessage');

            if (confirm && password !== confirm) {
                matchMessage.style.display = 'block';
                return false;
            } else {
                matchMessage.style.display = 'none';
                return true;
            }
        }

        document.getElementById('newPassword').addEventListener('input', function() {
            checkPasswordRequirements();
            if (document.getElementById('confirmPassword').value) {
                checkPasswordMatch();
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            if (!checkPasswordRequirements()) {
                showAlert(i18n.t('please_meet_requirements'), 'danger');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert(i18n.t('passwords_do_not_match'), 'danger');
                return;
            }

            if (currentPassword === newPassword) {
                showAlert(i18n.t('password_must_be_different_msg'), 'danger');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>' + i18n.t('changing');

            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
                const response = await fetch('/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, 'success');
                    document.getElementById('changePasswordForm').reset();
                    checkPasswordRequirements();

                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showAlert(data.message, 'danger');
                }
            } catch (error) {
                showAlert(i18n.t('error_occurred'), 'danger');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-key me-2"></i>' + i18n.t('change_password_title');
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
