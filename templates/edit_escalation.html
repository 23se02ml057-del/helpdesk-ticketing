<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ _('Edit') }} Escalation Rule</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:12px;
            box-shadow:0px 2px 10px rgba(0,0,0,.15);
        }

        .card-header{
            background:#ffc107;
            color:#000;
            font-size:22px;
            font-weight:bold;
        }

        .btn{
            border-radius:8px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-12 col-lg-8">

<div class="card">

<div class="card-header">

{{ _('Edit') }} Escalation Rule

</div>

<div class="card-body">

<form action="/update-escalation/{{ escalation.escalation_id }}" method="POST">

<div class="mb-3">

<label class="form-label">

{{ _('Priority') }}

</label>

<select
name="priority_name"
class="form-select"
required>

{% for priority in priorities %}

<option
value="{{ priority.priority_name }}"
{% if priority.priority_name == escalation.priority_name %}
selected
{% endif %}>

{{ priority.priority_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

SLA Rule

</label>

<select
name="sla_id"
class="form-select"
required>

{% for sla in sla_rules %}

<option
value="{{ sla.sla_id }}"
{% if sla.sla_id == escalation.sla_id %}
selected
{% endif %}>

SLA #{{ sla.sla_id }}
-
{{ sla.response_time }} Min /
{{ sla.resolution_time }} Min

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Escalation After (Minutes)

</label>

<input
type="number"
name="escalation_after"
class="form-control"
value="{{ escalation.escalation_after }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Notify {{ _('Role') }}

</label>

<select
name="notify_role"
class="form-select">

<option value="Support Agent"
{% if escalation.notify_role=="Support Agent" %}
selected
{% endif %}>
Support Agent
</option>

<option value="Support Manager"
{% if escalation.notify_role=="Support Manager" %}
selected
{% endif %}>
Support Manager
</option>

<option value="Super Admin"
{% if escalation.notify_role=="Super Admin" %}
selected
{% endif %}>
Super Admin
</option>

</select>

</div>

<div class="mb-4">

<label class="form-label">

{{ _('Status') }}

</label>

<select
name="status"
class="form-select">

<option value="Active"
{% if escalation.status=="Active" %}
selected
{% endif %}>
Active
</option>

<option value="Inactive"
{% if escalation.status=="Inactive" %}
selected
{% endif %}>
Inactive
</option>

</select>

</div>

<div class="d-flex justify-content-between">

<a
href="/escalations"
class="btn btn-secondary">

{{ _('Back') }}

</a>

<button
type="submit"
class="btn btn-warning">

{{ _('Update') }} Escalation Rule

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
